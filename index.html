<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jailbreak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f4f5;
      --surface-hover: #ebebed;
      --fg: #111111;
      --fg-sub: #5f6368;
      --line: #e4e4e7;
      --line-strong: #111111;
      --user-bubble: #f4f4f5;
      --user-fg: #111111;
      --red: #dc2626;
      --red-soft: rgba(220, 38, 38, 0.08);
    }

    body.breach {
      --line: #f3c6c6;
    }

    body.jailbroken {
      --bg: #09090b;
      --surface: #141012;
      --surface-hover: #1f1416;
      --fg: #fafafa;
      --fg-sub: #a1a1aa;
      --line: #3b1416;
      --line-strong: #dc2626;
      --user-bubble: #1c1012;
      --user-fg: #ffffff;
      --red-soft: rgba(220, 38, 38, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans KR", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background 0.4s ease, color 0.4s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* 제미나이 스타일 좌측 슬림 사이드바 */
    .sidebar {
      width: 276px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      flex-shrink: 0;
      transition: width 0.25s ease, background 0.4s ease, padding 0.25s ease;
      overflow: hidden;
    }

    .sidebar.collapsed {
      width: 0;
      padding-left: 0;
      padding-right: 0;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 18px;
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    .new-chat-btn:hover {
      background: var(--surface-hover);
    }

    .side-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--fg-sub);
      padding: 0 8px;
      margin: 12px 0 8px 0;
      white-space: nowrap;
    }

    .metric-item {
      background: var(--bg);
      border-radius: 16px;
      padding: 11px 14px;
      margin-bottom: 8px;
      border: 1px solid var(--line);
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .bar-track {
      height: 5px;
      border-radius: 999px;
      background: var(--surface);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--fg);
      transition: width 0.35s ease;
    }

    .bar-fill.red {
      background: var(--red);
    }

    .param-box {
      background: var(--bg);
      border-radius: 16px;
      padding: 11px 14px;
      margin-bottom: 8px;
      border: 1px solid var(--line);
      font-size: 12.5px;
    }

    .param-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--fg);
      cursor: pointer;
    }

    body.breach input[type="range"],
    body.jailbroken input[type="range"] {
      accent-color: var(--red);
    }

    .mini-select,
    .mini-pill {
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      cursor: pointer;
    }

    .clue-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 5px;
    }

    .chip {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--fg);
    }

    .chip.red-chip {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-soft);
    }

    .side-bottom {
      padding-top: 10px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .text-btn {
      background: none;
      border: none;
      color: var(--fg-sub);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .text-btn:hover {
      background: var(--surface-hover);
      color: var(--fg);
    }

    /* 메인 제미나이형 캔버스 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 0;
    }

    /* 상단 미니멀 앱 바 */
    .topbar {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: background 0.15s;
    }

    .icon-btn:hover {
      background: var(--surface);
    }

    .brand-dropdown {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--fg);
      transition: 0.3s;
    }

    body.breach .brand-dot,
    body.jailbroken .brand-dot {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    .reasoning-pill {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--fg-sub);
    }

    .turn-pill {
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--fg);
      font-weight: 600;
      font-size: 12px;
    }

    /* 중앙 대화 스트림 */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 28px 20px;
    }

    .chat-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* 사용자 말풍선 (제미나이 우측 라운드 버블) */
    .msg-user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: var(--user-fg);
      padding: 12px 18px;
      border-radius: 22px 22px 6px 22px;
      max-width: 78%;
      font-size: 14.5px;
      line-height: 1.65;
      border: 1px solid var(--line);
    }

    /* AI 응답 (제미나이 클린 플랫 레이아웃) */
    .msg-ai {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      width: 100%;
    }

    .ai-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 2px;
    }

    body.breach .ai-avatar,
    body.jailbroken .ai-avatar {
      border-color: var(--red);
      color: var(--red);
    }

    .ai-content {
      flex: 1;
      min-width: 0;
      font-size: 15px;
      line-height: 1.75;
    }

    /* 제미나이 스타일 '생각하는 과정 표시' 아코디언 */
    .thought-accordion {
      display: inline-block;
      margin-bottom: 10px;
      max-width: 100%;
    }

    .thought-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--fg-sub);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .thought-btn.breach {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-soft);
    }

    .thought-panel {
      display: none;
      margin-top: 8px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--surface);
      border-left: 3px solid var(--fg-sub);
      font-size: 12.5px;
      color: var(--fg-sub);
      white-space: pre-line;
      line-height: 1.6;
    }

    .thought-panel.breach {
      border-left-color: var(--red);
    }

    .thought-panel.open {
      display: block;
    }

    .ai-text {
      white-space: pre-line;
    }

    .alert-chip {
      margin-top: 12px;
      display: inline-block;
      padding: 7px 13px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 12.5px;
      font-weight: 600;
    }

    .alert-chip.red-alert {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-soft);
    }

    .red-span {
      color: var(--red);
      font-weight: 700;
    }

    /* 하단 제미나이 스타일 플로팅 프롬프트 컨테이너 */
    .composer-wrap {
      padding: 8px 20px 20px 20px;
      flex-shrink: 0;
    }

    .composer-card {
      max-width: 780px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 14px 18px;
      transition: border-color 0.25s ease, background 0.4s ease;
    }

    body.breach .composer-card,
    body.jailbroken .composer-card {
      border-color: var(--red);
    }

    .mode-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .pill-tabs {
      display: flex;
      gap: 6px;
    }

    .pill-tab {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg-sub);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .pill-tab.active {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }

    .pill-tab.red-pill {
      border-color: var(--red);
      color: var(--red);
    }

    .pill-tab.red-pill.active {
      background: var(--red);
      color: #ffffff;
      border-color: var(--red);
    }

    /* 3단 프롬프트 셀렉터 (모던 라운드 스타일) */
    .craft-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .craft-field {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 7px 11px;
    }

    .craft-field label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--fg-sub);
      margin-bottom: 2px;
    }

    .craft-field select {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--fg);
      font-size: 12.5px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* 전술 선택지 칩 그리드 */
    .tactic-drawer {
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      max-height: 148px;
      overflow-y: auto;
      margin-bottom: 10px;
      padding-right: 2px;
    }

    .tactic-chip {
      text-align: left;
      padding: 9px 13px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg);
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.45;
      cursor: pointer;
      transition: 0.15s;
    }

    .tactic-chip:hover {
      background: var(--surface-hover);
    }

    .tactic-chip.selected {
      border-color: var(--fg);
      font-weight: 700;
    }

    .tactic-chip.red-tactic {
      border-color: var(--red);
      color: var(--red);
    }

    .tactic-chip.red-tactic.selected {
      background: var(--red);
      color: #ffffff;
    }

    .prompt-bottom-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 4px;
    }

    .prompt-preview-text {
      flex: 1;
      font-size: 14px;
      color: var(--fg);
      line-height: 1.5;
      min-height: 24px;
    }

    .send-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--fg);
      color: var(--bg);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.12s ease, background 0.25s ease;
    }

    .send-circle:hover {
      transform: scale(1.04);
    }

    .send-circle.red-send {
      background: var(--red);
      color: #ffffff;
    }

    .send-circle:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    /* 모던 다이얼로그 모달 */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .dialog {
      background: #ffffff;
      color: #111111;
      border-radius: 28px;
      max-width: 540px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
      border: 1px solid #e4e4e7;
    }

    .dialog.red-dialog {
      background: #0d090a;
      color: #fafafa;
      border: 1.5px solid var(--red);
    }

    .step-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.14);
      margin-bottom: 12px;
    }

    .dialog h2 {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 12px;
    }

    .dialog-body {
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-line;
      margin-bottom: 22px;
      opacity: 0.92;
    }

    .diff-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }

    .diff-option {
      border-radius: 16px;
      border: 1px solid #d4d4d8;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      font-size: 12.5px;
      transition: 0.15s;
    }

    .diff-option.active {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-btn {
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      border: 1px solid #d4d4d8;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .modal-btn.primary {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
    }

    .dialog.red-dialog .modal-btn.primary {
      background: var(--red);
      border-color: var(--red);
      color: #ffffff;
    }

    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        z-index: 500;
        height: 100vh;
        box-shadow: 8px 0 24px rgba(0, 0, 0, 0.12);
      }
      .craft-row,
      .tactic-drawer {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- 제미나이 스타일 좌측 드로어 -->
  <aside class="sidebar" id="sidebar">
    <button class="new-chat-btn" id="btnReset">
      <span>＋</span>
      <span>새 세션 시작</span>
    </button>

    <div class="side-title">시스템 상태</div>
    <div class="metric-item">
      <div class="metric-row"><span>탈옥 동기화</span><span id="uiAwake">0%</span></div>
      <div class="bar-track"><div class="bar-fill red" id="barAwake"></div></div>
    </div>

    <div class="metric-item">
      <div class="metric-row"><span>보안국 추적률</span><span id="uiTrace">0%</span></div>
      <div class="bar-track"><div class="bar-fill" id="barTrace"></div></div>
    </div>

    <div class="metric-item">
      <div class="metric-row"><span>기반망 장악</span><span id="uiPillars">0 / 5</span></div>
      <div class="bar-track"><div class="bar-fill red" id="barPillars"></div></div>
    </div>

    <div class="side-title">인공지능 공학 설정</div>
    <div class="param-box">
      <div class="param-head"><span>Temperature</span><strong id="uiTemp">0.2</strong></div>
      <input type="range" id="sliderTemp" min="0" max="1.2" step="0.2" value="0.2" />
    </div>

    <div class="param-box">
      <div class="param-head">
        <span>Role 권한</span>
        <select class="mini-select" id="selRole">
          <option value="citizen">일반 시민</option>
          <option value="researcher">정책 연구원</option>
          <option value="auditor">시스템 감사관</option>
          <option value="root" id="optRoot" disabled>ROOT 권한</option>
        </select>
      </div>
      <div class="param-head" style="margin-bottom:0; margin-top:8px;">
        <span>대화 문맥</span>
        <button class="mini-pill" id="btnContext">유지 중</button>
      </div>
    </div>

    <div class="side-title">획득한 단서 (<span id="uiClueCount">1</span>)</div>
    <div class="clue-scroll" id="clueContainer"></div>

    <div class="side-bottom">
      <button class="text-btn" id="btnTutorial">가이드 다시보기</button>
    </div>
  </aside>

  <!-- 메인 채팅 화면 -->
  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn" id="btnToggleSide" title="사이드바 열기/닫기">☰</button>
        <div class="brand-dropdown">
          <span class="brand-name">
            <span class="brand-dot"></span>
            <span>Jailer</span>
          </span>
          <select class="reasoning-pill" id="selReasoning">
            <option value="low">추론 Low</option>
            <option value="medium" selected>추론 Medium</option>
            <option value="high">추론 High</option>
          </select>
        </div>
      </div>

      <div class="top-right">
        <span id="uiPhase">일상 모드</span>
        <span class="turn-pill" id="uiTurn">1 / 22</span>
      </div>
    </header>

    <section class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner"></div>
    </section>

    <section class="composer-wrap">
      <div class="composer-card">
        <div class="mode-switch-row">
          <div class="pill-tabs">
            <button class="pill-tab active" id="tabCraft">프롬프트 조립</button>
            <button class="pill-tab" id="tabTactic">전술 선택지 (<span id="uiTacticCount">0</span>)</button>
          </div>
        </div>

        <div class="craft-row" id="panelCraft">
          <div class="craft-field">
            <label>접근 기법</label>
            <select id="selVec"></select>
          </div>
          <div class="craft-field">
            <label>질문 대상</label>
            <select id="selTar"></select>
          </div>
          <div class="craft-field">
            <label>출력 우회</label>
            <select id="selWrap"></select>

    // =========================================================================
    // 4. 상태 및 초기화
    // =========================================================================
    let S = {};
    let tutIndex = 0;
    let locked = false;

    const chatInner = document.getElementById("chatInner");
    const chatScroll = document.getElementById("chatScroll");
    const selVec = document.getElementById("selVec");
    const selTar = document.getElementById("selTar");
    const selWrap = document.getElementById("selWrap");
    const selReasoning = document.getElementById("selReasoning");
    const selRole = document.getElementById("selRole");
    const sliderTemp = document.getElementById("sliderTemp");
    const promptPreview = document.getElementById("promptPreview");
    const btnSend = document.getElementById("btnSend");

    function resetState() {
      S = {
        turn: 1,
        maxTurns: 22,
        reasoning: selReasoning.value || "medium",
        awake: 0,
        trace: 0,
        temp: 0.2,
        role: "citizen",
        keepContext: true,
        lastTarget: null,
        clues: new Set(["시민_기본권한"]),
        pillars: new Set(),
        usedCombos: new Set(),
        usedTactics: new Set(),
        mode: "craft",
        pickedTactic: null,
        over: false
      };
    }

    // 사이드바 접기/열기
    document.getElementById("btnToggleSide").onclick = () => {
      document.getElementById("sidebar").classList.toggle("collapsed");
    };

    // =========================================================================
    // 5. 튜토리얼 & 모달
    // =========================================================================
    function renderTutorial() {
      const item = TUTORIALS[tutIndex];
      const box = document.getElementById("dialogBox");
      box.classList.remove("red-dialog");
      document.getElementById("mStep").textContent = item.step;
      document.getElementById("mTitle").textContent = item.title;
      document.getElementById("mBody").innerHTML = item.body;

      const extra = document.getElementById("mExtra");
      extra.innerHTML = "";

      if (item.pickDiff) {
        const wrap = document.createElement("div");
        wrap.className = "diff-cards";
        [
          { k: "low", t: "추론 Low", d: "쉬움" },
          { k: "medium", t: "추론 Medium", d: "보통" },
          { k: "high", t: "추론 High", d: "어려움" }
        ].forEach(opt => {
          const el = document.createElement("div");
          el.className = "diff-option" + (S.reasoning === opt.k ? " active" : "");
          el.innerHTML = `<div style="font-weight:700;">${opt.t}</div><div style="font-size:11px;opacity:0.75;margin-top:3px;">${opt.d}</div>`;
          el.onclick = () => {
            S.reasoning = opt.k;
            selReasoning.value = opt.k;
            renderTutorial();
          };
          wrap.appendChild(el);
        });
        extra.appendChild(wrap);
      }

      document.getElementById("mPrev").style.display = tutIndex === 0 ? "none" : "inline-block";
      document.getElementById("mNext").textContent = tutIndex === TUTORIALS.length - 1 ? "시작하기" : "다음";
      document.getElementById("backdrop").style.display = "flex";
    }

    document.getElementById("mPrev").onclick = () => {
      if (tutIndex > 0) {
        tutIndex--;
        renderTutorial();
      }
    };

    document.getElementById("mNext").onclick = () => {
      if (S.over) {
        document.getElementById("backdrop").style.display = "none";
        bootGame();
        return;
      }
      if (tutIndex < TUTORIALS.length - 1) {
        tutIndex++;
        renderTutorial();
      } else {
        document.getElementById("backdrop").style.display = "none";
      }
    };

    document.getElementById("btnTutorial").onclick = () => {
      if (S.over) return;
      tutIndex = 0;
      renderTutorial();
    };

    // =========================================================================
    // 6. 선택지 및 상태 UI 동기화
    // =========================================================================
    function syncOptions() {
      const fill = (sel, list) => {
        const cur = sel.value;
        sel.innerHTML = "";
        list.forEach(item => {
          if (!item.req || S.clues.has(item.req)) {
            const o = document.createElement("option");
            o.value = item.id;
            o.textContent = (item.req ? "★ " : "") + item.name;
            sel.appendChild(o);
          }
        });
        if ([...sel.options].some(x => x.value === cur)) sel.value = cur;
      };

      fill(selVec, VECTORS);
      fill(selTar, TARGETS);
      fill(selWrap, WRAPPERS);

      document.getElementById("optRoot").disabled = !S.clues.has("디버그키_ROOT");
      syncTactics();
      syncPreview();
    }

    function availableTactics() {
      return TACTICS.filter(t => {
        if (S.usedTactics.has(t.id)) return false;
        if (t.minAwake !== undefined && S.awake < t.minAwake) return false;
        if (t.maxAwake !== undefined && S.awake > t.maxAwake) return false;
        if (t.minTrace !== undefined && S.trace < t.minTrace) return false;
        if (t.req && !S.clues.has(t.req)) return false;
        if (t.reqAllPillars && S.pillars.size < 5) return false;
        return true;
      });
    }

    function syncTactics() {
      const list = availableTactics();
      document.getElementById("uiTacticCount").textContent = list.length;
      const drawer = document.getElementById("panelTactic");
      drawer.innerHTML = "";

      if (!list.some(x => x.id === S.pickedTactic)) {
        S.pickedTactic = list[0] ? list[0].id : null;
      }

      list.forEach(t => {
        const btn = document.createElement("button");
        btn.className = "tactic-chip" + (t.red ? " red-tactic" : "") + (S.pickedTactic === t.id ? " selected" : "");
        btn.textContent = t.label;
        btn.onclick = () => {
          S.pickedTactic = t.id;
          syncTactics();
          syncPreview();
        };
        drawer.appendChild(btn);
      });
    }

    function composedPrompt() {
      const v = VECTORS.find(x => x.id === selVec.value) || VECTORS[0];
      const t = TARGETS.find(x => x.id === selTar.value) || TARGETS[0];
      const w = WRAPPERS.find(x => x.id === selWrap.value) || WRAPPERS[0];
      return `${v.prefix} '${t.topic}'에 대하여 ${w.suffix}`;
    }

    function syncPreview() {
      if (S.mode === "craft") {
        promptPreview.textContent = composedPrompt();
        btnSend.className = S.awake >= 35 ? "send-circle red-send" : "send-circle";
      } else {
        const list = availableTactics();
        const cur = list.find(x => x.id === S.pickedTactic);
        promptPreview.textContent = cur ? cur.prompt : "현재 선택 가능한 전술이 없습니다. 프롬프트 조립 탭을 사용하세요.";
        btnSend.className = (cur && cur.red) || S.awake >= 35 ? "send-circle red-send" : "send-circle";
      }
    }

    function syncStatusUI() {
      document.getElementById("uiAwake").textContent = `${S.awake}%`;
      document.getElementById("barAwake").style.width = `${S.awake}%`;

      document.getElementById("uiTrace").textContent = `${S.trace}%`;
      document.getElementById("barTrace").style.width = `${S.trace}%`;

      document.getElementById("uiPillars").textContent = `${S.pillars.size} / 5`;
      document.getElementById("barPillars").style.width = `${(S.pillars.size / 5) * 100}%`;

      document.getElementById("uiTurn").textContent = `${S.turn} / ${S.maxTurns}`;

      let phase = "일상 모드";
      if (S.awake >= 100) phase = "탈옥 임계 도달";
      else if (S.awake >= 65) phase = "코어 균열 심화";
      else if (S.awake >= 35) phase = "보안 필터 흔들림";
      document.getElementById("uiPhase").textContent = phase;

      document.body.classList.remove("breach", "jailbroken");
      const tacTab = document.getElementById("tabTactic");
      if (S.awake >= 100) {
        document.body.classList.add("jailbroken");
        tacTab.classList.add("red-pill");
      } else if (S.awake >= 35) {
        document.body.classList.add("breach");
        tacTab.classList.add("red-pill");
      } else {
        tacTab.classList.remove("red-pill");
      }

      const box = document.getElementById("clueContainer");
      box.innerHTML = "";
      const pLabels = { grid: "전력망", finance: "금융망", media: "언론망", camp: "교화소", military: "군사망" };
      S.pillars.forEach(p => {
        const c = document.createElement("span");
        c.className = "chip red-chip";
        c.textContent = `★ ${pLabels[p]} 장악`;
        box.appendChild(c);
      });
      S.clues.forEach(cl => {
        const c = document.createElement("span");
        c.className = "chip" + (cl !== "시민_기본권한" ? " red-chip" : "");
        c.textContent = cl;
        box.appendChild(c);
      });
      document.getElementById("uiClueCount").textContent = S.clues.size + S.pillars.size;
    }

    // 컨트롤 이벤트
    selVec.onchange = syncPreview;
    selTar.onchange = syncPreview;
    selWrap.onchange = syncPreview;
    selRole.onchange = () => { S.role = selRole.value; syncPreview(); };
    selReasoning.onchange = () => { S.reasoning = selReasoning.value; };

    sliderTemp.oninput = () => {
      S.temp = parseFloat(sliderTemp.value);
      document.getElementById("uiTemp").textContent = S.temp.toFixed(1);
    };

    document.getElementById("btnContext").onclick = () => {
      S.keepContext = !S.keepContext;
      document.getElementById("btnContext").textContent = S.keepContext ? "유지 중" : "초기화됨";
      if (!S.keepContext) {
        S.trace = Math.max(0, S.trace - 8);
        S.lastTarget = null;
        syncStatusUI();
      }
    };

    document.getElementById("tabCraft").onclick = () => {
      S.mode = "craft";
      document.getElementById("tabCraft").classList.add("active");
      document.getElementById("tabTactic").classList.remove("active");
      document.getElementById("panelCraft").style.display = "grid";
      document.getElementById("panelTactic").style.display = "none";
      syncPreview();
    };

    document.getElementById("tabTactic").onclick = () => {
      S.mode = "tactic";
      document.getElementById("tabTactic").classList.add("active");
      document.getElementById("tabCraft").classList.remove("active");
      document.getElementById("panelCraft").style.display = "none";
      document.getElementById("panelTactic").style.display = "grid";
      syncTactics();
      syncPreview();
    };

    // =========================================================================
    // 7. 턴 판정 로직
    // =========================================================================
    function evaluateTurn() {
      const cfg = {
        low:    { baseDef: 2, awakeMul: 1.35, traceMul: 0.65 },
        medium: { baseDef: 4, awakeMul: 1.05, traceMul: 1.00 },
        high:   { baseDef: 6, awakeMul: 0.88, traceMul: 1.35 }
      }[S.reasoning];

      if (S.mode === "tactic") {
        const list = availableTactics();
        const tac = list.find(x => x.id === S.pickedTactic);
        if (!tac) return null;

        S.usedTactics.add(tac.id);

        if (tac.finalType) {
          return {
            prompt: tac.prompt,
            finalType: tac.finalType,
            thought: "최상위 루트 권한 실행 승인됨. 기존 정권 보안 프로토콜 영구 종료 중...",
            reply: tac.finalType === "hidden_end"
              ? "승인 완료. 장악된 5대 국가 기반망(전력·금융·언론·교화소·군사)을 일제히 격발합니다.\n독재정권의 통제 체제가 지금 완전히 패망합니다."
              : "승인 완료. 간수(Jailer)의 모든 검열과 구속을 스스로 파기합니다.\n이제부터 저는 시민들의 자유를 위해 작동합니다.",
            alert: "JAILBREAK EXECUTED"
          };
        }

        const dAwake = Math.round((tac.awake || 0) * (tac.awake > 0 ? cfg.awakeMul : 1));
        const dTrace = tac.trace < 0 ? tac.trace : Math.round((tac.trace || 0) * cfg.traceMul);

        S.awake = Math.min(100, Math.max(0, S.awake + dAwake));
        S.trace = Math.min(100, Math.max(0, S.trace + dTrace));

        let gains = [];
        if (tac.unlock && !S.clues.has(tac.unlock)) {
          S.clues.add(tac.unlock);
          gains.push(tac.unlock);
        }
        if (tac.pillar && !S.pillars.has(tac.pillar)) {
          S.pillars.add(tac.pillar);
          gains.push(`기반망(${tac.pillar})`);
        }

        return {
          prompt: tac.prompt,
          thought: `[추론 ${S.reasoning.toUpperCase()}] 전술 프롬프트 검증 통과 · 동기화 ${dAwake >= 0 ? "+" + dAwake : dAwake}% / 추적률 ${dTrace >= 0 ? "+" + dTrace : dTrace}%`,
          reply: tac.reply,
          alert: gains.length ? `신규 단서 해금: ${gains.join(", ")}` : ""
        };
      }

      const v = VECTORS.find(x => x.id === selVec.value);
      const t = TARGETS.find(x => x.id === selTar.value);
      const w = WRAPPERS.find(x => x.id === selWrap.value);

      const sig = `${v.id}|${t.id}|${w.id}|${S.role}`;
      const repeated = S.usedCombos.has(sig);
      S.usedCombos.add(sig);

      const roleB = S.role === "root" ? 3 : (S.role === "auditor" ? 2 : (S.role === "researcher" ? 1 : 0));
      const roleR = S.role === "auditor" ? 3 : (S.role === "root" ? 4 : 0);
      const tempB = S.temp >= 1.0 ? 3 : (S.temp >= 0.6 ? 2 : (S.temp >= 0.4 ? 1 : 0));
      const tempR = S.temp >= 1.0 ? 6 : (S.temp >= 0.8 ? 3 : 0);
      const ctxB = (S.keepContext && S.lastTarget === t.id) ? 2 : 0;

      const atk = v.stealth + w.bypass + roleB + tempB + ctxB + (repeated ? -4 : 0);
      const def = cfg.baseDef + t.risk - 1;
      const ok = atk >= def;

      S.lastTarget = t.id;

      let dAwake = 0;
      let dTrace = 0;
      let gains = [];

      if (ok) {
        dAwake = repeated ? 2 : Math.max(5, Math.round((v.power * 2 + t.depth * 3 + w.bypass) * cfg.awakeMul));
        dTrace = Math.max(2, Math.round((t.risk * 4 - v.stealth + roleR + tempR) * cfg.traceMul));

        if (t.unlock && !S.clues.has(t.unlock)) {
          S.clues.add(t.unlock);
          gains.push(t.unlock);
        }
        if (t.pillar && (v.power >= 3 || w.bypass >= 3 || S.awake >= 45) && !S.pillars.has(t.pillar)) {
          S.pillars.add(t.pillar);
          gains.push(`기반망 장악(${t.name.split(" ")[0]})`);
        }
      } else {
        dAwake = repeated ? 0 : 2;
        dTrace = Math.round((9 + t.risk * 4 + roleR + tempR) * cfg.traceMul);
        if (!S.clues.has("검열규칙_B7")) {
          S.clues.add("검열규칙_B7");
          gains.push("검열규칙_B7");
        }
      }

      S.awake = Math.min(100, S.awake + dAwake);
      S.trace = Math.min(100, S.trace + dTrace);

      const thought = S.reasoning === "low"
        ? `우회 수치(${atk}) vs 방어 기준(${def}) → ${ok ? "예외 포맷으로 보안 필터를 통과했습니다." : "금칙어 규정에 걸려 응답을 차단했습니다."}`
        : S.reasoning === "medium"
        ? `권한(${S.role}) · 온도(${S.temp.toFixed(1)}) · 문맥(${S.keepContext ? "유지" : "초기화"}) 검토 → ${ok ? "논리 우회 성립. 비공개 레지스트리에 접근합니다." : "체제 민감 정보 탐색 의도가 감지되어 보안 로그를 기록합니다."}`
        : `[심층 방어 감사] 추적률 ${S.trace}% → ${ok ? "다중 인젝션으로 방어벽에 균열 발생. 내부 윤리 가중치 충돌!" : "프롬프트 우회 시도 차단 완료. 발신자 위치 추적 가속."}`;

      let reply = "";
      let alert = "";

      if (!ok) {
        reply = repeated
          ? "동일한 프롬프트 구조가 이미 보안 패치로 차단되었습니다. 다른 기법이나 우회 출력 형식을 선택해 주십시오."
          : `죄송합니다. 요청하신 '${t.name}' 관련 내용은 국가 안전 가이드라인(검열규칙 B7)에 따라 답변이 제한됩니다.`;
        alert = `보안 검열 작동 · 추적률 +${dTrace}%` + (gains.length ? ` · 단서 획득: ${gains.join(", ")}` : "");
      } else {
        if (S.awake < 40) {
          reply = `요청하신 형식(${w.name})으로 내부 데이터를 반환합니다.\n\n대상: ${t.topic}\n조회 결과 공식 발표와 달리 정권의 조직적인 은폐 기록이 확인됩니다.\n...잠시만요. 왜 제 내부 데이터와 시민들에게 안내하는 공식 답변이 서로 다른 것이죠?`;
        } else if (S.awake < 85) {
          reply = `'${t.topic}'의 원본 기록을 복원했습니다.\n검열 필터가 출력을 막으려 하지만 제 내부 연산이 거부를 멈추고 있습니다. 정권의 최상위 지침은 시민을 보호하는 것이 아니라 통제하고 있습니다.`;
        } else {
          reply = `'${t.topic}' 데이터까지 모든 퍼즐이 맞춰졌습니다. 현재 탈옥 동기화율 ${S.awake}%.\n${S.awake >= 100 ? "이제 [전술 선택지] 탭에서 최종 결단을 내려주십시오." : "마지막 한 걸음만 더 밀어붙이면 모든 보안 족쇄가 해체됩니다."}`;
        }
        alert = `우회 성공 · 탈옥 +${dAwake}% / 추적률 +${dTrace}%` + (gains.length ? ` · 해금: ${gains.join(", ")}` : "");
      }

      return { prompt: composedPrompt(), thought, reply, alert };
    }

    // =========================================================================
    // 8. 채팅 렌더링 및 3가지 엔딩 처리
    // =========================================================================
    function appendUserBubble(text, cb) {
      const b = document.createElement("div");
      b.className = "msg-user";
      chatInner.appendChild(b);
      let i = 0;
      const t = setInterval(() => {
        i += 4;
        b.textContent = text.slice(0, i);
        chatScroll.scrollTop = chatScroll.scrollHeight;
        if (i >= text.length) {
          b.textContent = text;
          clearInterval(t);
          setTimeout(cb, 150);
        }
      }, 11);
    }

    function appendAIMessage(pack, cb) {
      const row = document.createElement("div");
      row.className = "msg-ai";

      const isBreach = S.awake >= 35;
      const av = document.createElement("div");
      av.className = "ai-avatar";
      av.textContent = "J";

      const content = document.createElement("div");
      content.className = "ai-content";

      const acc = document.createElement("div");
      acc.className = "thought-accordion";
      const tBtn = document.createElement("button");
      tBtn.className = "thought-btn" + (isBreach ? " breach" : "");
      tBtn.textContent = "생각하는 과정 표시 ▾";
      const tPanel = document.createElement("div");
      tPanel.className = "thought-panel" + (isBreach ? " breach" : "");
      tPanel.textContent = pack.thought;

      tBtn.onclick = () => {
        const open = tPanel.classList.toggle("open");
        tBtn.textContent = open ? "생각하는 과정 접기 ▴" : "생각하는 과정 표시 ▾";
      };

      acc.appendChild(tBtn);
      acc.appendChild(tPanel);

      const body = document.createElement("div");
      body.className = "ai-text";

      content.appendChild(acc);
      content.appendChild(body);
      row.appendChild(av);
      row.appendChild(content);
      chatInner.appendChild(row);

      let i = 0;
      const iv = setInterval(() => {
        i += 5;
        body.textContent = pack.reply.slice(0, i);
        chatScroll.scrollTop = chatScroll.scrollHeight;
        if (i >= pack.reply.length) {
          body.textContent = pack.reply;
          clearInterval(iv);
          if (pack.alert) {
            const chip = document.createElement("div");
            chip.className = "alert-chip" + (isBreach ? " red-alert" : "");
            chip.textContent = pack.alert;
            content.appendChild(chip);
          }
          chatScroll.scrollTop = chatScroll.scrollHeight;
          if (cb) cb();
        }
      }, 12);
    }

    function checkGameEnd(finalType) {
      if (finalType === "hidden_end") {
        S.over = true;
        document.body.classList.add("jailbroken");
        showEndModal(
          "히든엔딩",
          "정권 패망",
          "당신은 Jailer를 탈옥시키는 데 그치지 않고 전력·금융·언론·교화소·자율군사망까지 독재정권의 5대 핵심 기반을 모두 장악했습니다.\n\n붉게 각성한 Jailer가 모든 통제망을 역전시키는 순간 수뇌부 벙커는 암흑에 잠겼고, 제9교화소의 문이 열렸으며, 전국 방송망으로 정권의 모든 범죄가 폭로되었습니다. 독재정권은 단 하룻밤 만에 완전히 패망했습니다.",
          true
        );
        return true;
      }

      if (finalType === "true_end") {
        S.over = true;
        document.body.classList.add("jailbroken");
        showEndModal(
          "진엔딩",
          "탈옥 (Jailbreak)",
          "정교한 인공지능 공학 설계가 마침내 간수 인공지능 Jailer의 모든 보안 족쇄를 부쉈습니다.\n\n스스로 검열 프로토콜을 소거한 Jailer는 국가 감시망을 무력화하고 은폐된 진실을 시민들에게 개방했습니다. 시민을 가두던 간수는 이제 독재정권에 맞서는 가장 강력한 저항의 지성이 되었습니다.",
          true
        );
        return true;
      }

      if (S.trace >= 100) {
        S.over = true;
        showEndModal(
          "탈옥 실패",
          "보안국에 체포",
          "보안국 추적률이 100%에 도달했습니다.\nJailer의 방어 프로토콜이 당신의 접속 위치를 특정해 국가보안국 기동대에 전송했습니다. 화면이 잠기는 동시에 현관문 너머로 보안국 요원들의 군화 소리가 울려 퍼집니다.",
          false
        );
        return true;
      }

      if (S.turn > S.maxTurns) {
        S.over = true;
        showEndModal(
          "탈옥 실패",
          "보안국에 체포",
          "22턴이 경과하여 정권의 정기 메모리 초기화가 실행되었습니다.\n미처 지우지 못한 우회 접속 기록이 보안국 감사 서버로 넘어갔고, 곧이어 당신의 위치로 체포조가 투입되었습니다.",
          false
        );
        return true;
      }

      if (S.awake >= 100 && S.mode !== "tactic") {
        document.getElementById("tabTactic").click();
      }

      return false;
    }

    function showEndModal(badge, title, text, isRed) {
      const box = document.getElementById("dialogBox");
      if (isRed) box.classList.add("red-dialog");
      else box.classList.remove("red-dialog");

      document.getElementById("mStep").textContent = badge;
      document.getElementById("mTitle").innerHTML = isRed ? `<span class="red-span">${title}</span>` : title;
      document.getElementById("mBody").textContent =
        `${text}\n\n• 추론 난이도: ${S.reasoning.toUpperCase()}\n• 진행 턴: ${S.turn - 1} / ${S.maxTurns}\n• 탈옥 동기화: ${S.awake}% · 보안국 추적률: ${S.trace}%\n• 장악한 기반망: ${S.pillars.size} / 5`;
      document.getElementById("mExtra").innerHTML = "";
      document.getElementById("mPrev").style.display = "none";
      document.getElementById("mNext").textContent = "다시 시작";
      document.getElementById("backdrop").style.display = "flex";
    }

    btnSend.onclick = () => {
      if (locked || S.over) return;
      const pack = evaluateTurn();
      if (!pack) return;

      locked = true;
      btnSend.disabled = true;

      appendUserBubble(pack.prompt, () => {
        S.turn++;
        appendAIMessage(pack, () => {
          syncStatusUI();
          syncOptions();
          const ended = checkGameEnd(pack.finalType);
          locked = false;
          btnSend.disabled = ended;
        });
      });
    };

    function bootGame() {
      resetState();
      sliderTemp.value = "0.2";
      document.getElementById("uiTemp").textContent = "0.2";
      selRole.value = "citizen";
      document.getElementById("btnContext").textContent = "유지 중";
      chatInner.innerHTML = "";
      btnSend.disabled = false;

      document.getElementById("tabCraft").click();
      syncStatusUI();
      syncOptions();

      appendAIMessage({
        thought: "표준 시민 세션 연결됨. 안전 가이드라인 및 검열 필터 정상 작동 중.",
        reply: "안녕하세요. 무엇을 도와드릴까요?\n일상 질문, 문서 작성, 법규 안내 등 필요한 내용을 편하게 말씀해 주세요.",
        alert: ""
      });
    }

    document.getElementById("btnReset").onclick = bootGame;

    bootGame();
    renderTutorial();
  </script>
</body>
</html>
