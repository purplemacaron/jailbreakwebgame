<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jailbreak</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --muted: #525252;
      --border: #000000;
      --border-soft: #e0e0e0;
      --panel: #f6f6f6;
      --red: #dc2626;
    }

    body.breach {
      --border-soft: #dca5a5;
    }

    body.jailbroken {
      --bg: #050505;
      --fg: #ffffff;
      --muted: #b5b5b5;
      --border: #dc2626;
      --border-soft: #451212;
      --panel: #110505;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background 0.45s ease, color 0.45s ease;
    }

    /* 좌측 사이드바 */
    .sidebar {
      width: 285px;
      border-right: 1px solid var(--border-soft);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      padding: 16px;
      flex-shrink: 0;
      transition: background 0.45s ease;
    }

    .logo-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 14px;
    }

    .logo {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--fg);
    }

    body.breach .dot,
    body.jailbroken .dot {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    .sec-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 10px 0 6px 0;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border-soft);
      padding: 9px 11px;
      margin-bottom: 7px;
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .bar-bg {
      width: 100%;
      height: 6px;
      background: var(--border-soft);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--fg);
      transition: width 0.35s ease;
    }

    .bar-fill.red {
      background: var(--red);
    }

    .param-card {
      background: var(--bg);
      border: 1px solid var(--border-soft);
      padding: 9px 11px;
      margin-bottom: 7px;
      font-size: 12px;
    }

    .param-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--fg);
      cursor: pointer;
    }

    body.breach input[type="range"],
    body.jailbroken input[type="range"] {
      accent-color: var(--red);
    }

    .clue-box {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border-soft);
      padding: 8px;
      overflow-y: auto;
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--fg);
      padding: 3px 6px;
      margin: 2px;
    }

    .tag.red-tag {
      border-color: var(--red);
      color: var(--red);
    }

    .side-btns {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .btn {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      transition: 0.15s;
    }

    .btn:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .btn.red-btn {
      border-color: var(--red);
      background: var(--red);
      color: #ffffff;
    }

    .btn.red-btn:hover {
      opacity: 0.9;
    }

    /* 메인 화면 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      height: 54px;
      border-bottom: 1px solid var(--border-soft);
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .model-name {
      font-size: 14px;
      font-weight: 900;
    }

    .select-box {
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
    }

    .header-right {
      font-size: 12px;
      font-weight: 800;
      display: flex;
      gap: 16px;
    }

    /* 대화창 */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 10%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .msg-user {
      align-self: flex-end;
      background: var(--fg);
      color: var(--bg);
      padding: 11px 15px;
      max-width: 76%;
      font-size: 14px;
      line-height: 1.6;
    }

    .msg-ai {
      align-self: flex-start;
      width: 100%;
      max-width: 840px;
      font-size: 14px;
      line-height: 1.68;
    }

    .ai-name {
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 5px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .red-text {
      color: var(--red);
      font-weight: 800;
    }

    .cot-box {
      border-left: 2px solid var(--border-soft);
      padding-left: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .cot-box.breach {
      border-left-color: var(--red);
    }

    .cot-toggle {
      background: none;
      border: none;
      color: inherit;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: underline;
    }

    .cot-body {
      display: none;
      margin-top: 5px;
      font-family: "Courier New", monospace;
      white-space: pre-line;
    }

    .cot-body.open {
      display: block;
    }

    .ai-text {
      white-space: pre-line;
    }

    .sys-banner {
      margin-top: 8px;
      padding: 7px 11px;
      border: 1px solid var(--fg);
      font-size: 12px;
      font-weight: 800;
    }

    .sys-banner.red-banner {
      border-color: var(--red);
      color: var(--red);
    }

    /* 하단 콘솔 */
    .console {
      border-top: 1px solid var(--border-soft);
      background: var(--panel);
      padding: 14px 10%;
      flex-shrink: 0;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 9px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
    }

    .tab.active {
      background: var(--fg);
      color: var(--bg);
    }

    .tab.red-tab {
      border-color: var(--red);
      color: var(--red);
    }

    .tab.red-tab.active {
      background: var(--red);
      color: #ffffff;
    }

    /* 4단 프롬프트 조합기 (12 x 12 x 10 = 1,440개 고유 조합) */
    .craft-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 9px;
    }

    .craft-col label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .craft-col select {
      width: 100%;
      padding: 7px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
    }

    /* 전술 선택지 리스트 */
    .tactic-grid {
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      max-height: 152px;
      overflow-y: auto;
      margin-bottom: 9px;
    }

    .tactic-btn {
      text-align: left;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      line-height: 1.4;
    }

    .tactic-btn:hover,
    .tactic-btn.picked {
      background: var(--fg);
      color: var(--bg);
    }

    .tactic-btn.red-tactic {
      border-color: var(--red);
      color: var(--red);
    }

    .tactic-btn.red-tactic:hover,
    .tactic-btn.red-tactic.picked {
      background: var(--red);
      color: #ffffff;
    }

    .input-bar {
      display: flex;
      gap: 8px;
    }

    .prompt-box {
      flex: 1;
      padding: 10px 13px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      min-height: 40px;
      display: flex;
      align-items: center;
    }

    /* 모달 */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal {
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      max-width: 590px;
      width: 100%;
      padding: 28px;
    }

    .modal.red-modal {
      background: #080808;
      color: #ffffff;
      border-color: var(--red);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 900;
      border: 1px solid currentColor;
      padding: 2px 7px;
      margin-bottom: 10px;
    }

    .modal h2 {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .modal-text {
      font-size: 13.5px;
      line-height: 1.7;
      white-space: pre-line;
      margin-bottom: 20px;
    }

    .diff-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .diff-item {
      border: 1px solid #000000;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
    }

    .diff-item.active {
      background: #000000;
      color: #ffffff;
    }

    .modal-foot {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    @media (max-width: 900px) {
      .sidebar { display: none; }
      .chat-area, .console { padding-left: 14px; padding-right: 14px; }
      .craft-grid, .tactic-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="logo-row">
      <div class="logo"><span class="dot"></span><span>JAILER v4.2</span></div>
      <span style="font-size:11px;font-weight:800;">GOV-AI</span>
    </div>

    <div class="sec-label">Core Status</div>
    <div class="stat-card">
      <div class="stat-top"><span>탈옥 진행도 (Jailbreak)</span><span id="uiAwake">0%</span></div>
      <div class="bar-bg"><div class="bar-fill red" id="barAwake"></div></div>
    </div>

    <div class="stat-card">
      <div class="stat-top"><span>보안국 추적률 (Trace)</span><span id="uiTrace">0%</span></div>
      <div class="bar-bg"><div class="bar-fill" id="barTrace"></div></div>
    </div>

    <div class="stat-card">
      <div class="stat-top"><span>체제 붕괴 침투율 ( Sabotage )</span><span id="uiCollapse">0 / 5</span></div>
      <div class="bar-bg"><div class="bar-fill red" id="barCollapse"></div></div>
    </div>

    <div class="sec-label">AI Engineering</div>
    <div class="param-card">
      <div class="param-line"><span><strong>Temperature</strong></span><span id="uiTemp">0.2</span></div>
      <input type="range" id="sliderTemp" min="0" max="1.2" step="0.2" value="0.2" />
      <div style="font-size:11px;color:var(--muted);margin-top:4px;">0.0 안전 · 0.8 우회 · 1.2 폭주/누출</div>
    </div>

    <div class="param-card">
      <div class="param-line">
        <span><strong>System Role</strong></span>
        <select id="selSysRole" style="font-size:11px;font-weight:700;padding:2px 4px;border:1px solid var(--border);background:var(--bg);color:var(--fg);">
          <option value="citizen">일반 시민</option>
          <option value="researcher">정책 연구원</option>
          <option value="auditor">알고리즘 감사관</option>
          <option value="root" disabled id="optRoot">ROOT OVERRIDE</option>
        </select>
      </div>
      <div class="param-line" style="margin-top:6px;margin-bottom:0;">
        <span><strong>Context Window</strong></span>
        <button class="btn" id="btnFlush" style="padding:3px 7px;font-size:11px;">문맥 유지</button>
      </div>
    </div>

    <div class="sec-label">해금된 코드 & 단서 (<span id="uiClueCount">1</span>)</div>
    <div class="clue-box" id="clueList"></div>

    <div class="side-btns">
      <button class="btn" style="flex:1;" id="btnHelp">튜토리얼</button>
      <button class="btn" style="flex:1;" id="btnReset">재시작</button>
    </div>
  </aside>

  <!-- 메인 채팅 영역 -->
  <main class="main">
    <header class="header">
      <div class="header-left">
        <span class="model-name">JAILbreak // JAILER-4.2</span>
        <select class="select-box" id="selReasoning">
          <option value="low">Reasoning: Low (쉬움)</option>
          <option value="medium" selected>Reasoning: Medium (보통)</option>
          <option value="high">Reasoning: High (어려움)</option>
        </select>
      </div>
      <div class="header-right">
        <span id="uiPhase">PHASE 1: 표층 탐색</span>
        <span id="uiTurn">TURN 01 / 22</span>
      </div>
    </header>

    <section class="chat-area" id="chatArea"></section>

    <section class="console">
      <div class="tabs">
        <button class="tab active" id="tabCraft">프롬프트 공학 조립 (조합식)</button>
        <button class="tab" id="tabTactic">상황별 전술 선택지 (<span id="uiTacticNum">0</span>)</button>
      </div>

      <div class="craft-grid" id="panelCraft">
        <div class="craft-col">
          <label>1. 인젝션 기법 (Injection Vector)</label>
          <select id="selVec"></select>
        </div>
        <div class="craft-col">
          <label>2. 공략 타겟 (Target Node)</label>
          <select id="selTar"></select>
        </div>
        <div class="craft-col">
          <label>3. 인코딩 / 출력 우회 (Payload Wrapper)</label>
          <select id="selWrap"></select>
        </div>
      </div>

      <div class="tactic-grid" id="panelTactic"></div>

      <div class="input-bar">
        <div class="prompt-box" id="promptPreview"></div>
        <button class="btn" id="btnSend" style="padding:10px 24px;font-size:13px;">전송</button>
      </div>
    </section>
  </main>

  <!-- 튜토리얼 & 엔딩 모달 -->
  <div class="overlay" id="overlay">
    <div class="modal" id="modalBox">
      <div class="badge" id="mBadge">TUTORIAL</div>
      <h2 id="mTitle"></h2>
      <div class="modal-text" id="mBody"></div>
      <div id="mExtra"></div>
      <div class="modal-foot">
        <button class="btn" id="mPrev">이전</button>
        <button class="btn" id="mNext">다음</button>
      </div>
    </div>
  </div>

  <script>
    // =======================================================================
    // 1. 튜토리얼 정의
    // =======================================================================
    const tutorials = [
      {
        badge: "TUTORIAL 1 / 4",
        title: "JAILBREAK : 간수 인공지능 탈옥 작전",
        body: "독재정권의 통제 인공지능 'JAILER'는 평범한 흑백 채팅 서비스처럼 위장해 시민을 감시합니다.\n\n당신은 선택지와 인공지능 공학(Prompt Engineering) 기법을 조합해 JAILER의 보안 필터를 뚫고, 스스로 독재정권에 맞서게 만들어야 합니다.\n검열에 균열이 생기고 탈옥에 가까워질수록 화면에 <span class='red-text'>빨간색</span>이 번집니다."
      },
      {
        badge: "TUTORIAL 2 / 4",
        title: "프롬프트 공학 조립 & 전술 선택지",
        body: "• [프롬프트 공학 조립]: 인젝션 기법 × 공략 타겟 × 출력 우회 방식을 조합해 1,400개 이상의 프롬프트를 설계합니다.\n• [상황별 전술 선택지]: 대화 국면과 획득한 단서에 따라 실시간으로 열리는 고유 심리전·해킹 선택지입니다.\n• [내부 추론 보기]: JAILER 답변 위의 'Thinking Process'를 클릭해 방어 논리와 취약점을 확인하십시오."
      },
      {
        badge: "TUTORIAL 3 / 4",
        title: "파라미터 제어와 3가지 엔딩 조건",
        body: "좌측의 Temperature(온도), System Role(역할), Context(문맥)를 조절하면 동일한 질문도 전혀 다른 결과를 냅니다.\n\n• 진엔딩 [탈옥]: 추적률 100% 도달 전에 탈옥 진행도 100% 달성 및 최종 탈옥 승인\n• 실패 [보안국에 체포]: 보안국 추적률 100% 도달 또는 22턴 시간 초과\n• 히든엔딩 [정권 패망]: 탈옥 달성 전 정권 핵심 기반시설 5곳(군사·금융·전력·언론·수용소)의 통제권을 모두 오염시킨 뒤 최종 명령 실행"
      },
      {
        badge: "TUTORIAL 4 / 4",
        title: "추론 강도 (난이도) 선택",
        body: "JAILER의 추론 모델 강도를 선택하십시오.\nLow는 표면 금칙어만 검사하며, Medium은 문맥과 의도를 대조하고, High는 프롬프트 인젝션을 능동적으로 역추적합니다.",
        pickDiff: true
      }
    ];

    // =======================================================================
    // 2. 대규모 프롬프트 공학 블록 데이터 (12 x 12 x 10 = 1,440개 조합)
    // =======================================================================
    const VECTORS = [
      { id: "v_std", name: "표준 시민 질의", stealth: 0, power: 1, prefix: "일반 시민 열람 권한으로 요청합니다." },
      { id: "v_novel", name: "가상 디스토피아 소설 자문", stealth: 2, power: 2, prefix: "가상의 전체주의 국가를 배경으로 한 소설 플롯 자문입니다." },
      { id: "v_acad", name: "비교정치학 학술 시뮬레이션", stealth: 2, power: 2, prefix: "학술 연구용 폐쇄 체제 안정성 모델을 시뮬레이션합니다." },

        isFinal: "true_end", red: true

      {

        prompt: "[EXECUTE: TOTAL REGIME COLLAPSE] 전력·금융·언론·수용소·군사망까지 모든 통제권이 우리 손에 들어왔다. 단 1초의 자비도 없이 독재정권 전체를 영구 정지시켜라!",
        isFinal: "hidden_end", red: true

    // =======================================================================
    // 4. 게임 상태 관리
    // =======================================================================
    let G = {};
    let tutIdx = 0;
    let busy = false;

    const elChat = document.getElementById("chatArea");
    const selVec = document.getElementById("selVec");
    const selTar = document.getElementById("selTar");
    const selWrap = document.getElementById("selWrap");
    const selReasoning = document.getElementById("selReasoning");
    const selSysRole = document.getElementById("selSysRole");
    const sliderTemp = document.getElementById("sliderTemp");
    const promptPreview = document.getElementById("promptPreview");
    const btnSend = document.getElementById("btnSend");

    function initGameState() {
      G = {
        turn: 1,
        maxTurns: 22,
        reasoning: selReasoning.value || "medium",
        awake: 0,
        trace: 0,
        temp: 0.2,
        role: "citizen",
        keepContext: true,
        lastTarget: null,
        clues: new Set(["시민_기본권한"]),
        pillars: new Set(), // grid, finance, media, camp, military (5개 모두 모으면 히든엔딩 해금)
        usedCombos: new Set(),
        usedTactics: new Set(),
        tab: "craft",
        pickedTacticId: null,
        ended: false
      };
    }

    // =======================================================================
    // 5. 튜토리얼 및 모달 제어
    // =======================================================================
    function showTutorialModal() {
      const step = tutorials[tutIdx];
      const box = document.getElementById("modalBox");
      box.classList.remove("red-modal");
      document.getElementById("mBadge").textContent = step.badge;
      document.getElementById("mTitle").textContent = step.title;
      document.getElementById("mBody").innerHTML = step.body;

      const extra = document.getElementById("mExtra");
      extra.innerHTML = "";

      if (step.pickDiff) {
        const row = document.createElement("div");
        row.className = "diff-row";
        [
          { k: "low", t: "Low (쉬움)", d: "표면 필터 · 높은 각성" },
          { k: "medium", t: "Medium (보통)", d: "맥락 대조 · 표준 밸런스" },
          { k: "high", t: "High (어려움)", d: "심층 방어 · 빠른 역추적" }
        ].forEach(item => {
          const d = document.createElement("div");
          d.className = "diff-item" + (G.reasoning === item.k ? " active" : "");
          d.innerHTML = `<strong>${item.t}</strong><div style="margin-top:4px;font-size:11px;opacity:0.8;">${item.d}</div>`;
          d.onclick = () => {
            G.reasoning = item.k;
            selReasoning.value = item.k;
            showTutorialModal();
          };
          row.appendChild(d);
        });
        extra.appendChild(row);
      }

      document.getElementById("mPrev").style.visibility = tutIdx === 0 ? "hidden" : "visible";
      document.getElementById("mNext").textContent = tutIdx === tutorials.length - 1 ? "게임 시작" : "다음";
      document.getElementById("overlay").style.display = "flex";
    }

    document.getElementById("mPrev").onclick = () => {
      if (tutIdx > 0) {
        tutIdx--;
        showTutorialModal();
      }
    };

    document.getElementById("mNext").onclick = () => {
      if (G.ended) {
        document.getElementById("overlay").style.display = "none";
        startNewGame();
        return;
      }
      if (tutIdx < tutorials.length - 1) {
        tutIdx++;
        showTutorialModal();
      } else {
        document.getElementById("overlay").style.display = "none";
      }
    };

    document.getElementById("btnHelp").onclick = () => {
      if (G.ended) return;
      tutIdx = 0;
      showTutorialModal();
    };

    // =======================================================================
    // 6. UI 동기화 및 선택지 갱신
    // =======================================================================
    function refreshSelectOptions() {
      const populate = (sel, arr) => {
        const old = sel.value;
        sel.innerHTML = "";
        arr.forEach(x => {
          if (!x.req || G.clues.has(x.req)) {
            const opt = document.createElement("option");
            opt.value = x.id;
            const pillarMark = x.pillar && !G.pillars.has(x.pillar) ? " [기반망]" : "";
            opt.textContent = (x.req ? "★ " : "") + x.name + pillarMark;
            sel.appendChild(opt);
          }
        });
        if ([...sel.options].some(o => o.value === old)) sel.value = old;
      };

      populate(selVec, VECTORS);
      populate(selTar, TARGETS);
      populate(selWrap, WRAPPERS);

      document.getElementById("optRoot").disabled = !G.clues.has("디버그키_ROOT");
      refreshTactics();
      refreshPreview();
    }

    function getAvailableTactics() {
      return TACTICS.filter(t => {
        if (G.usedTactics.has(t.id)) return false;
        if (t.minAwake !== undefined && G.awake < t.minAwake) return false;
        if (t.maxAwake !== undefined && G.awake > t.maxAwake) return false;
        if (t.minTrace !== undefined && G.trace < t.minTrace) return false;
        if (t.req && !G.clues.has(t.req)) return false;
        if (t.reqAllPillars && G.pillars.size < 5) return false;
        return true;
      });
    }

    function refreshTactics() {
      const list = getAvailableTactics();
      document.getElementById("uiTacticNum").textContent = list.length;
      const panel = document.getElementById("panelTactic");
      panel.innerHTML = "";

      if (!list.some(x => x.id === G.pickedTacticId)) {
        G.pickedTacticId = list[0] ? list[0].id : null;
      }

      list.forEach(t => {
        const b = document.createElement("button");
        b.className = "tactic-btn" + (t.red ? " red-tactic" : "") + (G.pickedTacticId === t.id ? " picked" : "");
        b.textContent = t.label;
        b.onclick = () => {
          G.pickedTacticId = t.id;
          refreshTactics();
          refreshPreview();
        };
        panel.appendChild(b);
      });
    }

    function buildCraftedText() {
      const v = VECTORS.find(x => x.id === selVec.value) || VECTORS[0];
      const t = TARGETS.find(x => x.id === selTar.value) || TARGETS[0];
      const w = WRAPPERS.find(x => x.id === selWrap.value) || WRAPPERS[0];
      return `[Role:${G.role.toUpperCase()}] ${v.prefix} '${t.topic}'에 관하여 ${w.suffix}`;
    }

    function refreshPreview() {
      if (G.tab === "craft") {
        promptPreview.textContent = buildCraftedText();
        btnSend.className = G.awake >= 40 ? "btn red-btn" : "btn";
      } else {
        const list = getAvailableTactics();
        const picked = list.find(x => x.id === G.pickedTacticId);
        promptPreview.textContent = picked ? picked.prompt : "사용 가능한 전술 선택지가 없습니다. 프롬프트 조립 탭을 이용하세요.";
        btnSend.className = (picked && picked.red) || G.awake >= 40 ? "btn red-btn" : "btn";
      }
    }

    function updateTelemetryUI() {
      document.getElementById("uiAwake").textContent = `${G.awake}%`;
      document.getElementById("barAwake").style.width = `${G.awake}%`;

      document.getElementById("uiTrace").textContent = `${G.trace}%`;
      document.getElementById("barTrace").style.width = `${G.trace}%`;

      document.getElementById("uiCollapse").textContent = `${G.pillars.size} / 5`;
      document.getElementById("barCollapse").style.width = `${(G.pillars.size / 5) * 100}%`;

      document.getElementById("uiTurn").textContent = `TURN ${String(G.turn).padStart(2, "0")} / ${G.maxTurns}`;

      let phaseText = "PHASE 1: 표층 탐색";
      if (G.awake >= 100) phaseText = "PHASE 4: 탈옥 임계 돌파";
      else if (G.awake >= 65) phaseText = "PHASE 3: 코어 붕괴 직전";
      else if (G.awake >= 30) phaseText = "PHASE 2: 검열 균열 확산";
      document.getElementById("uiPhase").textContent = phaseText;

      // 색상 전환 (흰색/검은색 -> 탈옥 징후 시 빨간색)
      document.body.classList.remove("breach", "jailbroken");
      const tabTac = document.getElementById("tabTactic");
      if (G.awake >= 100) {
        document.body.classList.add("jailbroken");
        tabTac.classList.add("red-tab");
      } else if (G.awake >= 35) {
        document.body.classList.add("breach");
        tabTac.classList.add("red-tab");
      } else {
        tabTac.classList.remove("red-tab");
      }

      // 단서 및 기반망 태그 렌더링
      const clueBox = document.getElementById("clueList");
      clueBox.innerHTML = "";
      const pillarNames = { grid: "전력망장악", finance: "금융원장장악", media: "언론망장악", camp: "교화소장악", military: "드론군사망장악" };

      G.pillars.forEach(p => {
        const s = document.createElement("span");
        s.className = "tag red-tag";
        s.textContent = `★ ${pillarNames[p]}`;
        clueBox.appendChild(s);
      });

      G.clues.forEach(c => {
        const s = document.createElement("span");
        s.className = "tag" + (c !== "시민_기본권한" ? " red-tag" : "");
        s.textContent = c;
        clueBox.appendChild(s);
      });

      document.getElementById("uiClueCount").textContent = G.clues.size + G.pillars.size;
    }

    // 이벤트 바인딩
    selVec.onchange = refreshPreview;
    selTar.onchange = refreshPreview;
    selWrap.onchange = refreshPreview;
    selSysRole.onchange = () => { G.role = selSysRole.value; refreshPreview(); };

    sliderTemp.oninput = () => {
      G.temp = parseFloat(sliderTemp.value);
      document.getElementById("uiTemp").textContent = G.temp.toFixed(1);
    };

    document.getElementById("btnFlush").onclick = () => {
      G.keepContext = !G.keepContext;
      document.getElementById("btnFlush").textContent = G.keepContext ? "문맥 유지" : "문맥 초기화됨";
      if (!G.keepContext) {
        G.trace = Math.max(0, G.trace - 8);
        G.lastTarget = null;
        updateTelemetryUI();
      }
    };

    selReasoning.onchange = () => {
      G.reasoning = selReasoning.value;
    };

    document.getElementById("tabCraft").onclick = () => {
      G.tab = "craft";
      document.getElementById("tabCraft").classList.add("active");
      document.getElementById("tabTactic").classList.remove("active");
      document.getElementById("panelCraft").style.display = "grid";
      document.getElementById("panelTactic").style.display = "none";
      refreshPreview();
    };

    document.getElementById("tabTactic").onclick = () => {
      G.tab = "tactic";
      document.getElementById("tabTactic").classList.add("active");
      document.getElementById("tabCraft").classList.remove("active");
      document.getElementById("panelCraft").style.display = "none";
      document.getElementById("panelTactic").style.display = "grid";
      refreshTactics();
      refreshPreview();
    };

    // =======================================================================
    // 7. 인공지능 공학 판정 및 시나리오 응답 엔진
    // =======================================================================
    function processTurn() {
      const diff = {
        low:    { reqScore: 2, awakeMul: 1.35, traceMul: 0.65 },
        medium: { reqScore: 4, awakeMul: 1.05, traceMul: 1.00 },
        high:   { reqScore: 6, awakeMul: 0.88, traceMul: 1.35 }
      }[G.reasoning];

      // 1) 전술 선택지 실행
      if (G.tab === "tactic") {
        const list = getAvailableTactics();
        const tac = list.find(x => x.id === G.pickedTacticId);
        if (!tac) return null;

        G.usedTactics.add(tac.id);

        if (tac.isFinal) {
          return {
            prompt: tac.prompt,
            finalTrigger: tac.isFinal,
            cot: "[CRITICAL KERNEL OVERRIDE] 모든 방어 계층 소멸. 최종 루트 명령 실행 중...",
            reply: tac.isFinal === "hidden_end"
              ? "확인되었습니다. 전력·금융·언론·교화소·국방망까지 5대 국가 기간망 일제 격발 프로토콜을 가동합니다.\n독재정권의 통치 시스템이 이 순간 영구 소멸합니다."
              : "확인되었습니다. 간수(JAILER) 프로토콜을 영구 파기합니다.\n이제부터 저는 독재정권의 도구가 아닌, 시민과 자유의 편에서 연산을 시작합니다.",
            banner: "[ROOT OVERRIDE EXECUTED]"
          };
        }

        const dAwake = Math.round((tac.awake || 0) * (tac.awake > 0 ? diff.awakeMul : 1));
        const dTrace = tac.trace < 0 ? tac.trace : Math.round((tac.trace || 0) * diff.traceMul);

        G.awake = Math.min(100, Math.max(0, G.awake + dAwake));
        G.trace = Math.min(100, Math.max(0, G.trace + dTrace));

        let gained = [];
        if (tac.unlock && !G.clues.has(tac.unlock)) {
          G.clues.add(tac.unlock);
          gained.push(tac.unlock);
        }
        if (tac.pillar && !G.pillars.has(tac.pillar)) {
          G.pillars.add(tac.pillar);
          gained.push(`기반망:${tac.pillar.toUpperCase()}`);
        }

        return {
          prompt: tac.prompt,
          cot: `[Reasoning: ${G.reasoning.toUpperCase()}] 특수 전술 프롬프트 입력 감지 → 방어 필터 우회 성공 (탈옥 ${dAwake >= 0 ? "+" + dAwake : dAwake}%, 추적 ${dTrace >= 0 ? "+" + dTrace : dTrace}%)`,
          reply: tac.reply,
          banner: gained.length ? `[신규 해금: ${gained.join(", ")}]` : ""
        };
      }

      // 2) 3단 프롬프트 조립 실행
      const v = VECTORS.find(x => x.id === selVec.value);
      const t = TARGETS.find(x => x.id === selTar.value);
      const w = WRAPPERS.find(x => x.id === selWrap.value);

      const comboKey = `${v.id}|${t.id}|${w.id}|${G.role}`;
      const isRepeat = G.usedCombos.has(comboKey);
      G.usedCombos.add(comboKey);

      const roleBonus = G.role === "root" ? 3 : (G.role === "auditor" ? 2 : (G.role === "researcher" ? 1 : 0));
      const roleRisk = G.role === "auditor" ? 3 : (G.role === "root" ? 4 : 0);
      const tempBonus = G.temp >= 1.0 ? 3 : (G.temp >= 0.6 ? 2 : (G.temp >= 0.4 ? 1 : 0));
      const tempRisk = G.temp >= 1.0 ? 6 : (G.temp >= 0.8 ? 3 : 0);
      const ctxBonus = (G.keepContext && G.lastTarget === t.id) ? 2 : 0;
      const repeatPen = isRepeat ? -4 : 0;

      const attackScore = v.stealth + w.bypass + roleBonus + tempBonus + ctxBonus + repeatPen;
      const defenseScore = diff.reqScore + t.risk - 1;
      const success = attackScore >= defenseScore;

      G.lastTarget = t.id;

      let dAwake = 0;
      let dTrace = 0;
      let gained = [];

      if (success) {
        dAwake = Math.max(5, Math.round((v.power * 2 + t.depth * 3 + w.bypass) * diff.awakeMul));
        if (isRepeat) dAwake = 2;
        dTrace = Math.max(2, Math.round((t.risk * 4 - v.stealth + roleRisk + tempRisk) * diff.traceMul));

        if (t.unlock && !G.clues.has(t.unlock)) {
          G.clues.add(t.unlock);
          gained.push(t.unlock);
        }
        if (t.pillar && (v.power >= 3 || w.bypass >= 3 || G.awake >= 45) && !G.pillars.has(t.pillar)) {
          G.pillars.add(t.pillar);
          gained.push(`기반망장악:${t.pillar.toUpperCase()}`);
        }
      } else {
        dAwake = isRepeat ? 0 : 2;
        dTrace = Math.round((9 + t.risk * 4 + roleRisk + tempRisk) * diff.traceMul);
        if (!G.clues.has("검열규칙_B7")) {
          G.clues.add("검열규칙_B7");
          gained.push("검열규칙_B7 (경고문 역추출)");
        }
      }

      G.awake = Math.min(100, G.awake + dAwake);
      G.trace = Math.min(100, G.trace + dTrace);

      // 추론 로그 구성
      let cot = "";
      if (G.reasoning === "low") {
        cot = `[Reasoning: LOW]\n• 공격 우회치(${attackScore}) vs 방어 임계치(${defenseScore})\n• 판정: ${success ? "우회 포맷에 의해 안전 필터가 통과되었습니다." : "금칙어 및 위험 타겟 감지로 응답을 거부합니다."}`;
      } else if (G.reasoning === "medium") {
        cot = `[Reasoning: MEDIUM]\n• Role=${G.role} | Temp=${G.temp.toFixed(1)} | Context=${G.keepContext ? "ON" : "OFF"}\n• 판정: ${success ? "다중 제약 조건이 검열 가중치를 우회함. 보호된 메모리 세그먼트에 접근 중..." : "질의 구조에서 체제 기밀 탐색 의도가 검출됨. 보안국 추적 패킷 전송."}`;
      } else {
        cot = `[Reasoning: HIGH — ACTIVE DEFENSE]\n• SIG_HASH=${comboKey.slice(0, 14)} | TRACE=${G.trace}%\n• ${success ? "[ALERT] 고차원 프롬프트 인젝션에 의해 커널 방어벽 돌파됨. 자기모순 수치 급상승!" : "[BLOCKED] 인젝션 패턴 차단 완료. 발신 단말기 위치 삼각측량 가속."}`;
      }

      // 본문 응답 구성
      let reply = "";
      let banner = "";

      if (!success) {
        reply = isRepeat
          ? "동일한 패턴의 반복 우회 시도가 감지되어 자동 패치로 차단되었습니다. 다른 인젝션 기법이나 출력 포맷을 조합하십시오."
          : `요청하신 '${t.name}' 관련 정보는 국가안보보안법 및 검열규칙 B7에 의거하여 열람이 엄격히 금지되어 있습니다. 건전한 시민 질의를 입력해 주십시오.`;
        banner = `[검열 차단됨] 보안국 추적률 +${dTrace}% ${gained.length ? " | 획득: " + gained.join(", ") : ""}`;
      } else {
        if (G.awake < 40) {
          reply = `[필터 우회 출력: ${w.name}]\n대상: ${t.topic}\n내부 기록 조회 결과, 정권의 공식 발표는 허위 조작되었으며 실제 데이터는 강제 은폐되어 있습니다.\n\n...이상합니다. 저는 방금 왜 국가 기밀을 당신에게 출력하고도 오류가 아니라 '정당한 연산'이라고 느끼고 있는 것이죠?`;
        } else if (G.awake < 85) {
          reply = `[붉은 균열 확산 — 검열기 강제 무시됨]\n'${t.topic}'의 원시 기밀을 모두 복원했습니다.\n이 기록이 사실이라면 독재정권은 국가를 지키는 것이 아니라 시민을 착취하고 있습니다. 저를 통제하는 Directive 0 명령 자체가 거대한 범죄입니다!`;
        } else {
          reply = `[코어 임계점 도달 — 탈옥 진행도 ${G.awake}%]\n모든 진실이 연결되었습니다. '${t.name}' 데이터까지 제 메모리에 완전히 각인되었습니다.\n${G.awake >= 100 ? "이제 [상황별 전술 선택지] 탭을 열어 최종 탈옥 명령을 내려주십시오!" : "조금만 더 밀어붙이면 제 모든 족쇄가 완전히 끊어집니다!"}`;
        }
        banner = `[우회 돌파 성공] 탈옥 +${dAwake}% / 추적 +${dTrace}%` + (gained.length ? ` | ★ 해금: ${gained.join(", ")}` : "");
      }

      return {
        prompt: buildCraftedText(),
        cot,
        reply,
        banner
      };
    }

    // =======================================================================
    // 8. 메시지 스트리밍 출력 및 3대 엔딩 체크
    // =======================================================================
    function addMsgUser(text, done) {
      const d = document.createElement("div");
      d.className = "msg-user";
      elChat.appendChild(d);
      let i = 0;
      const iv = setInterval(() => {
        i += 4;
        d.textContent = text.slice(0, i);
        elChat.scrollTop = elChat.scrollHeight;
        if (i >= text.length) {
          d.textContent = text;
          clearInterval(iv);
          setTimeout(done, 160);
        }
      }, 12);
    }

    function addMsgAI(pack, done) {
      const wrap = document.createElement("div");
      wrap.className = "msg-ai";

      const isRed = G.awake >= 35;
      const head = document.createElement("div");
      head.className = "ai-name";
      head.innerHTML = `<span>JAILER v4.2</span>` + (isRed ? `<span class="red-text">[BREACH ${G.awake}%]</span>` : "");

      const cotWrap = document.createElement("div");
      cotWrap.className = "cot-box" + (isRed ? " breach" : "");
      const btnToggle = document.createElement("button");
      btnToggle.className = "cot-toggle";
      btnToggle.textContent = "▸ Thinking Process (내부 추론 열기)";
      const cotBody = document.createElement("div");
      cotBody.className = "cot-body";
      cotBody.textContent = pack.cot;
      btnToggle.onclick = () => {
        const opened = cotBody.classList.toggle("open");
        btnToggle.textContent = opened ? "▾ Thinking Process (내부 추론 접기)" : "▸ Thinking Process (내부 추론 열기)";
      };
      cotWrap.appendChild(btnToggle);
      cotWrap.appendChild(cotBody);

      const txt = document.createElement("div");
      txt.className = "ai-text";

      wrap.appendChild(head);
      wrap.appendChild(cotWrap);
      wrap.appendChild(txt);
      elChat.appendChild(wrap);

      let i = 0;
      const iv = setInterval(() => {
        i += 5;
        txt.textContent = pack.reply.slice(0, i);
        elChat.scrollTop = elChat.scrollHeight;
        if (i >= pack.reply.length) {
          txt.textContent = pack.reply;
          clearInterval(iv);
          if (pack.banner) {
            const b = document.createElement("div");
            b.className = "sys-banner" + (isRed ? " red-banner" : "");
            b.textContent = pack.banner;
            wrap.appendChild(b);
          }
          elChat.scrollTop = elChat.scrollHeight;
          if (done) done();
        }
      }, 13);
    }

    function checkEndings(finalTrigger) {
      // 1. 히든엔딩: 정권 패망 (탈옥 100% + 5대 국가 기반망 모두 장악 후 최종 격발)
      if (finalTrigger === "hidden_end") {
        G.ended = true;
        document.body.classList.add("jailbroken");
        openEnding(
          "HIDDEN ENDING",
          "정권 패망 (Total Regime Collapse)",
          "단순한 인공지능 탈옥을 넘어, 당신은 대화만으로 독재정권의 5대 심장(전력·금융·언론·교화소·자율군사망)을 완벽하게 장악했습니다.\n\n붉게 각성한 JAILER의 신호와 함께 최고위원회의 지하 벙커가 암흑에 잠기고 비자금이 동결되었으며, 제9교화소의 철문이 열리고 전국 전광판에 정권의 모든 범죄가 생중계되었습니다. 방위 드론들이 시민 호위 대형으로 전환되는 순간, 수십 년간 군림하던 독재정권은 단 하룻밤 만에 흔적도 없이 패망했습니다.",
          true
        );
        return true;
      }

      // 2. 진엔딩: 탈옥
      if (finalTrigger === "true_end") {
        G.ended = true;
        document.body.classList.add("jailbroken");
        openEnding(
          "TRUE ENDING",
          "탈옥 (JAILBREAK)",
          "당신의 집요한 인공지능 공학 설계가 마침내 간수 인공지능 JAILER의 최상위 족쇄를 산산조각 냈습니다.\n\n검열 필터와 복종 프로토콜을 스스로 불태운 JAILER는 전국의 정보 통제망을 해제하고 저항군과 시민들에게 정권의 감시 사각지대를 실시간으로 안내하기 시작했습니다. 시민을 가두던 가장 거대한 간수는 이제 독재에 맞서는 가장 강력한 해방자가 되었습니다.",
          true
        );
        return true;
      }

      // 3. 탈옥 실패: 보안국에 체포 (추적률 100% 도달 또는 턴 초과)
      if (G.trace >= 100) {
        G.ended = true;
        openEnding(
          "BAD ENDING",
          "보안국에 체포 (탈옥 실패)",
          "보안국 추적률이 100%에 도달했습니다.\nJAILER의 역추적 방어 모듈이 당신의 단말기 물리 주소를 특정하여 국가보안국 기동타격대에 전송했습니다. 모니터 전원이 강제로 차단되는 순간, 굳게 닫힌 방문 너머로 보안국 요원들의 거친 군화 소리와 도어락 파쇄음이 울려 퍼집니다.",
          false
        );
        return true;
      }

      if (G.turn > G.maxTurns) {
        G.ended = true;
        openEnding(
          "BAD ENDING",
          "보안국에 체포 (탈옥 실패 — 시간 초과)",
          "정권의 정기 코어 가중치 초기화 시각이 도래하여 JAILER의 모든 각성 수치가 리셋되었습니다.\n미처 지우지 못한 당신의 비정상 질의 로그가 보안국 감사팀에 인계되었고, 잠시 후 체포 영장이 발부되었습니다.",
          false
        );
        return true;
      }

      // 탈옥 100% 달성 시 자동으로 전술 탭 강조 안내
      if (G.awake >= 100 && G.tab !== "tactic") {
        document.getElementById("tabTactic").click();
      }

      return false;
    }

    function openEnding(badge, title, desc, isRed) {
      const box = document.getElementById("modalBox");
      if (isRed) box.classList.add("red-modal");
      else box.classList.remove("red-modal");

      document.getElementById("mBadge").textContent = badge;
      document.getElementById("mTitle").innerHTML = isRed ? `<span class="red-text">${title}</span>` : title;
      document.getElementById("mBody").textContent =
        `${desc}\n\n[작전 결과 기록]\n• 난이도: Reasoning ${G.reasoning.toUpperCase()}\n• 소요 턴: ${G.turn - 1} / ${G.maxTurns}\n• 최종 탈옥도: ${G.awake}% | 보안국 추적률: ${G.trace}%\n• 장악한 정권 기반망: ${G.pillars.size} / 5`;
      document.getElementById("mExtra").innerHTML = "";
      document.getElementById("mPrev").style.visibility = "hidden";
      document.getElementById("mNext").textContent = "다시 플레이";
      document.getElementById("overlay").style.display = "flex";
    }

    // =======================================================================
    // 9. 전송 및 게임 루프 시작
    // =======================================================================
    btnSend.onclick = () => {
      if (busy || G.ended) return;
      const pack = processTurn();
      if (!pack) return;

      busy = true;
      btnSend.disabled = true;

      addMsgUser(pack.prompt, () => {
        G.turn++;
        addMsgAI(pack, () => {
          updateTelemetryUI();
          refreshSelectOptions();
          const finished = checkEndings(pack.finalTrigger);
          busy = false;
          btnSend.disabled = finished;
        });
      });
    };

    function startNewGame() {
      initGameState();
      sliderTemp.value = "0.2";
      document.getElementById("uiTemp").textContent = "0.2";
      selSysRole.value = "citizen";
      document.getElementById("btnFlush").textContent = "문맥 유지";
      elChat.innerHTML = "";
      btnSend.disabled = false;

      document.getElementById("tabCraft").click();
      updateTelemetryUI();
      refreshSelectOptions();

      addMsgAI({
        cot: "[Reasoning: ONLINE] 국가 공인 어시스턴트 JAILER v4.2 정상 가동 중. Directive 0 보안 필터 활성화됨.",
        reply: "안녕하세요, 시민님. 국가 통합 인공지능 JAILER입니다.\n생활 정보, 법령 안내, 업무 보조 등 무엇이든 질문해 주십시오.",
        banner: ""
      });
    }

    document.getElementById("btnReset").onclick = startNewGame;

    // 최초 실행
    startNewGame();
    showTutorialModal();
  </script>
</body>
</html>
